<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Lorem Ipsum Generator – fique.my</title>
  <meta name="description" content="Free in-browser lorem ipsum placeholder text generator for mockups and designs. Nothing leaves your browser." />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="favicon.ico" />
  <style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
:root { --bg:#f5f7fa; --card-bg:#fff; --radius:12px; --shadow:0 2px 8px rgba(0,0,0,0.06); --text:#1f2d3d; --muted:#6b7280; --border:#e8eaee; --brand:#6366f1; --brand-gradient:linear-gradient(90deg,#6366f1 0%,#a78bfa 100%); }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:"Inter",system-ui,sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }
.page-title { text-align:center; font-size:1.5rem; font-weight:700; margin:24px 0 8px; }
.page-subtitle { text-align:center; font-size:0.85rem; color:var(--muted); margin-bottom:20px; padding:0 1rem; }
.wrap { max-width:760px; margin:auto; padding:0 1.25rem 2rem; }
.card { background:var(--card-bg); padding:1.25rem; border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:1.25rem; }
.badge { display:inline-block; background:#eef2ff; color:var(--brand); font-size:0.7rem; font-weight:600; padding:3px 8px; border-radius:999px; }
input[type=number] { padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:0.85rem; font-family:inherit; color:var(--text); }
input[type=number]:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(99,102,241,0.12); }
.btn { padding:0.6rem 1rem; border-radius:999px; cursor:pointer; border:none; font-size:0.82rem; font-weight:600; transition:all .2s; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
.btn-primary { background:var(--brand-gradient); color:#fff; }
.btn-primary:hover:not(:disabled) { filter:brightness(1.06); transform:translateY(-1px); box-shadow:0 4px 12px rgba(99,102,241,0.3); }
.btn-outline { background:#fff; border:1px solid var(--border); color:#374151; }
.btn-outline:hover { background:#f9fafb; }
.opt-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
.opt-row label { font-size:0.82rem; color:var(--text); font-weight:500; }
.out { width:100%; margin-top:12px; border:1px solid var(--border); border-radius:10px; padding:12px; font-size:0.88rem; line-height:1.55; background:#fafafa; min-height:120px; white-space:pre-wrap; word-break:break-word; }
.copied { color:#059669 !important; }
  </style>
</head>
<body>
<h1 class="page-title">Lorem Ipsum Generator <span class="badge">Free</span></h1>
<p class="page-subtitle">Placeholder text for mockups and designs. 100% in your browser.</p>

<div class="wrap">
  <div class="card">
    <div class="opt-row">
      <label for="liCount" style="font-weight:500;">Paragraphs</label>
      <input type="number" id="liCount" min="1" max="50" value="3" style="width:80px;" />
      <button class="btn btn-primary" id="liGen">Generate</button>
      <button class="btn btn-outline" id="liCopy">Copy</button>
    </div>
    <div class="out" id="liOut"></div>
  </div>
</div>

<script>
(function () {
  "use strict";
  function copyText(text, btn) {
    if (!text) return;
    function flash() {
      if (!btn) return;
      var old = btn.textContent;
      btn.textContent = "Copied!"; btn.classList.add("copied");
      setTimeout(function () { btn.textContent = old; btn.classList.remove("copied"); }, 1400);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(flash, function () { legacyCopy(text); flash(); });
    } else { legacyCopy(text); flash(); }
  }
  function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }

  var LOREM = ("lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor " +
    "incididunt ut labore et dolore magna aliqua ut enim ad minim veniam quis nostrud " +
    "exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat duis aute irure " +
    "dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur " +
    "excepteur sint occaecat cupidatat non proident sunt in culpa qui officia deserunt " +
    "mollit anim id est laborum sed ut perspiciatis unde omnis iste natus error voluptatem " +
    "accusantium doloremque laudantium totam rem aperiam eaque ipsa quae ab illo inventore " +
    "veritatis et quasi architecto beatae vitae dicta sunt explicabo").split(" ");
  var liOut = document.getElementById("liOut");
  function rint(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function makeSentence() {
    var len = rint(8, 16), out = [];
    for (var i = 0; i < len; i++) out.push(LOREM[Math.floor(Math.random() * LOREM.length)]);
    var s = out.join(" ");
    return s.charAt(0).toUpperCase() + s.slice(1) + ".";
  }
  function makeParagraph() {
    var n = rint(4, 7), sents = [];
    for (var i = 0; i < n; i++) sents.push(makeSentence());
    return sents.join(" ");
  }
  function generateLorem() {
    var n = parseInt(document.getElementById("liCount").value, 10) || 1;
    n = Math.max(1, Math.min(50, n));
    var paras = [];
    for (var i = 0; i < n; i++) {
      if (i === 0) paras.push("Lorem ipsum dolor sit amet, consectetur adipiscing elit. " + makeParagraph());
      else paras.push(makeParagraph());
    }
    liOut.textContent = paras.join("\n\n");
  }
  document.getElementById("liGen").addEventListener("click", generateLorem);
  document.getElementById("liCopy").addEventListener("click", function () { copyText(liOut.textContent, this); });
  generateLorem();
})();
</script>
<script src="nav.js" defer></script>
</body>
</html>

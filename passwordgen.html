<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Password Generator – fique.my</title>
  <meta name="description" content="Free in-browser strong password generator with length and character options. Nothing is stored or sent anywhere." />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="favicon.ico" />
  <style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
:root { --bg:#f5f7fa; --card-bg:#fff; --radius:12px; --shadow:0 2px 8px rgba(0,0,0,0.06); --text:#1f2d3d; --muted:#6b7280; --border:#e8eaee; --brand:#6366f1; --brand-gradient:linear-gradient(90deg,#6366f1 0%,#a78bfa 100%); }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:"Inter",system-ui,sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }
.page-title { text-align:center; font-size:1.5rem; font-weight:700; margin:24px 0 8px; }
.page-subtitle { text-align:center; font-size:0.85rem; color:var(--muted); margin-bottom:20px; padding:0 1rem; }
.wrap { max-width:620px; margin:auto; padding:0 1.25rem 2rem; }
.card { background:var(--card-bg); padding:1.25rem; border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:1.25rem; }
.badge { display:inline-block; background:#eef2ff; color:var(--brand); font-size:0.7rem; font-weight:600; padding:3px 8px; border-radius:999px; }
input[type=range] { accent-color:var(--brand); }
input[type=checkbox] { accent-color:var(--brand); width:16px; height:16px; }
input[type=text] { padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:0.85rem; font-family:inherit; color:var(--text); }
input[type=text]:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(99,102,241,0.12); }
.btn { padding:0.6rem 1rem; border-radius:999px; cursor:pointer; border:none; font-size:0.82rem; font-weight:600; transition:all .2s; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
.btn-primary { background:var(--brand-gradient); color:#fff; }
.btn-primary:hover:not(:disabled) { filter:brightness(1.06); transform:translateY(-1px); box-shadow:0 4px 12px rgba(99,102,241,0.3); }
.btn-outline { background:#fff; border:1px solid var(--border); color:#374151; }
.btn-outline:hover { background:#f9fafb; }
.btn-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
.opt-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
.opt-row label { font-size:0.82rem; color:var(--text); font-weight:500; display:inline-flex; align-items:center; gap:6px; }
.range-row { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.range-row input[type=range] { flex:1; }
.range-val { font-weight:700; color:var(--brand); min-width:28px; text-align:right; }
.pw-out { display:flex; gap:8px; align-items:stretch; margin-top:6px; flex-wrap:wrap; }
.pw-out input { flex:1; min-width:180px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:0.95rem; }
.strength { margin-top:12px; }
.strength-bar { height:8px; border-radius:999px; background:#e5e7eb; overflow:hidden; }
.strength-bar > span { display:block; height:100%; width:0; transition:width .2s,background .2s; }
.strength-lbl { font-size:0.75rem; color:var(--muted); margin-top:6px; }
.copied { color:#059669 !important; }
.hint { font-size:0.72rem; color:var(--muted); margin-top:12px; line-height:1.5; }
  </style>
</head>
<body>
<h1 class="page-title">Password Generator <span class="badge">Free</span></h1>
<p class="page-subtitle">Generate a strong random password. Nothing is stored or sent anywhere.</p>

<div class="wrap">
  <div class="card">
    <div class="range-row">
      <label for="pwLen" style="font-size:0.82rem;font-weight:500;">Length</label>
      <input type="range" id="pwLen" min="6" max="64" value="16" />
      <span class="range-val" id="pwLenVal">16</span>
    </div>
    <div class="opt-row">
      <label><input type="checkbox" id="pwUpper" checked /> Uppercase</label>
      <label><input type="checkbox" id="pwLower" checked /> Lowercase</label>
      <label><input type="checkbox" id="pwNum" checked /> Numbers</label>
      <label><input type="checkbox" id="pwSym" checked /> Symbols</label>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="pwGen">Generate</button>
    </div>
    <div class="pw-out">
      <input type="text" id="pwOut" readonly placeholder="Your password appears here" />
      <button class="btn btn-outline" id="pwCopy">Copy</button>
    </div>
    <div class="strength">
      <div class="strength-bar"><span id="pwBar"></span></div>
      <div class="strength-lbl" id="pwStrength">Strength: —</div>
    </div>
    <div class="hint">Passwords are generated locally in your browser and never leave your device.</div>
  </div>
</div>

<script>
(function () {
  "use strict";
  function copyText(text, btn) {
    if (!text) return;
    function flash() {
      if (!btn) return;
      var old = btn.textContent;
      btn.textContent = "Copied!"; btn.classList.add("copied");
      setTimeout(function () { btn.textContent = old; btn.classList.remove("copied"); }, 1400);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(flash, function () { legacyCopy(text); flash(); });
    } else { legacyCopy(text); flash(); }
  }
  function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }

  var pwLen = document.getElementById("pwLen");
  var pwLenVal = document.getElementById("pwLenVal");
  var pwOut = document.getElementById("pwOut");
  var pwBar = document.getElementById("pwBar");
  var pwStrength = document.getElementById("pwStrength");
  var SETS = {
    upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
    lower: "abcdefghijklmnopqrstuvwxyz",
    num: "0123456789",
    sym: "!@#$%^&*()-_=+[]{};:,.<>?/"
  };
  function rnd(n) {
    if (window.crypto && window.crypto.getRandomValues) {
      var a = new Uint32Array(1); window.crypto.getRandomValues(a); return a[0] % n;
    }
    return Math.floor(Math.random() * n);
  }
  pwLen.addEventListener("input", function () { pwLenVal.textContent = pwLen.value; });
  function generatePassword() {
    var pool = "", required = [];
    if (document.getElementById("pwUpper").checked) { pool += SETS.upper; required.push(SETS.upper); }
    if (document.getElementById("pwLower").checked) { pool += SETS.lower; required.push(SETS.lower); }
    if (document.getElementById("pwNum").checked)   { pool += SETS.num;   required.push(SETS.num); }
    if (document.getElementById("pwSym").checked)   { pool += SETS.sym;   required.push(SETS.sym); }
    if (!pool) { pwOut.value = ""; setStrength(0, "Pick at least one option"); return; }
    var len = parseInt(pwLen.value, 10);
    var chars = [];
    required.forEach(function (set) { chars.push(set[rnd(set.length)]); });
    while (chars.length < len) { chars.push(pool[rnd(pool.length)]); }
    for (var i = chars.length - 1; i > 0; i--) { var j = rnd(i + 1); var tmp = chars[i]; chars[i] = chars[j]; chars[j] = tmp; }
    var pw = chars.slice(0, len).join("");
    pwOut.value = pw;
    scoreStrength(pw, pool.length);
  }
  function scoreStrength(pw, poolSize) {
    var entropy = pw.length * (Math.log(poolSize) / Math.log(2));
    var pct, label;
    if (entropy < 40)      { pct = 25;  label = "Weak"; }
    else if (entropy < 60) { pct = 55;  label = "Fair"; }
    else if (entropy < 80) { pct = 80;  label = "Strong"; }
    else                   { pct = 100; label = "Very strong"; }
    setStrength(pct, label + " (~" + Math.round(entropy) + " bits)");
  }
  function setStrength(pct, label) {
    pwBar.style.width = pct + "%";
    var color = pct <= 25 ? "#ef4444" : pct <= 55 ? "#f59e0b" : pct <= 80 ? "#10b981" : "#6366f1";
    pwBar.style.background = color;
    pwStrength.textContent = "Strength: " + label;
  }
  document.getElementById("pwGen").addEventListener("click", generatePassword);
  document.getElementById("pwCopy").addEventListener("click", function () { copyText(pwOut.value, this); });
  generatePassword();
})();
</script>
<script src="nav.js" defer></script>
</body>
</html>

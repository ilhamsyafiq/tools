<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Word Counter – fique.my</title>
  <meta name="description" content="Free in-browser word & character counter. Live counts of words, characters, sentences, lines and reading time. Nothing leaves your browser." />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="favicon.ico" />
  <style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
:root { --bg:#f5f7fa; --card-bg:#fff; --radius:12px; --shadow:0 2px 8px rgba(0,0,0,0.06); --text:#1f2d3d; --muted:#6b7280; --border:#e8eaee; --brand:#6366f1; --brand-gradient:linear-gradient(90deg,#6366f1 0%,#a78bfa 100%); }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:"Inter",system-ui,sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }
.page-title { text-align:center; font-size:1.5rem; font-weight:700; margin:24px 0 8px; }
.page-subtitle { text-align:center; font-size:0.85rem; color:var(--muted); margin-bottom:20px; padding:0 1rem; }
.wrap { max-width:760px; margin:auto; padding:0 1.25rem 2rem; }
.card { background:var(--card-bg); padding:1.25rem; border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:1.25rem; }
.badge { display:inline-block; background:#eef2ff; color:var(--brand); font-size:0.7rem; font-weight:600; padding:3px 8px; border-radius:999px; }
textarea { width:100%; min-height:200px; resize:vertical; border:1px solid var(--border); border-radius:10px; padding:12px; font-family:inherit; font-size:0.9rem; color:var(--text); line-height:1.5; }
textarea:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(99,102,241,0.12); }
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:10px; margin-top:14px; }
.stat { background:#f9fafb; border:1px solid var(--border); border-radius:10px; padding:12px; text-align:center; }
.stat .num { font-size:1.35rem; font-weight:700; color:var(--brand); line-height:1.1; }
.stat .lbl { font-size:0.68rem; color:var(--muted); margin-top:4px; text-transform:uppercase; letter-spacing:.03em; }
.hint { font-size:0.72rem; color:var(--muted); margin-top:12px; line-height:1.5; }
  </style>
</head>
<body>
<h1 class="page-title">Word &amp; Character Counter <span class="badge">Free</span></h1>
<p class="page-subtitle">Type or paste text — counts update live. 100% in your browser, nothing is uploaded.</p>

<div class="wrap">
  <div class="card">
    <textarea id="wcInput" placeholder="Start typing or paste your text here…"></textarea>
    <div class="stats-grid">
      <div class="stat"><div class="num" id="wcChars">0</div><div class="lbl">Characters</div></div>
      <div class="stat"><div class="num" id="wcCharsNs">0</div><div class="lbl">No spaces</div></div>
      <div class="stat"><div class="num" id="wcWords">0</div><div class="lbl">Words</div></div>
      <div class="stat"><div class="num" id="wcSentences">0</div><div class="lbl">Sentences</div></div>
      <div class="stat"><div class="num" id="wcLines">0</div><div class="lbl">Lines</div></div>
      <div class="stat"><div class="num" id="wcRead">0s</div><div class="lbl">Reading time</div></div>
    </div>
    <div class="hint">Reading time assumes ~200 words per minute. Nothing is uploaded or stored.</div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var wcInput = document.getElementById("wcInput");
  function updateCounts() {
    var t = wcInput.value;
    var chars = t.length;
    var charsNs = t.replace(/\s/g, "").length;
    var words = (t.trim().match(/\S+/g) || []).length;
    var sentences = (t.match(/[^.!?]+[.!?]+(\s|$)/g) || []).length;
    if (sentences === 0 && t.trim().length) sentences = 1;
    var lines = t.length ? t.split(/\r\n|\r|\n/).length : 0;
    var secs = Math.round((words / 200) * 60);
    var readStr;
    if (words === 0) readStr = "0s";
    else if (secs < 60) readStr = secs + "s";
    else readStr = Math.floor(secs / 60) + "m " + (secs % 60) + "s";
    document.getElementById("wcChars").textContent = chars.toLocaleString();
    document.getElementById("wcCharsNs").textContent = charsNs.toLocaleString();
    document.getElementById("wcWords").textContent = words.toLocaleString();
    document.getElementById("wcSentences").textContent = sentences.toLocaleString();
    document.getElementById("wcLines").textContent = lines.toLocaleString();
    document.getElementById("wcRead").textContent = readStr;
  }
  wcInput.addEventListener("input", updateCounts);
  updateCounts();
})();
</script>
<script src="nav.js" defer></script>
</body>
</html>

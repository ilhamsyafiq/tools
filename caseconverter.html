<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Case Converter – fique.my</title>
  <meta name="description" content="Free in-browser text case converter: UPPERCASE, lowercase, Title Case, Sentence case, camelCase, snake_case, kebab-case. Nothing leaves your browser." />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="favicon.ico" />
  <style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
:root { --bg:#f5f7fa; --card-bg:#fff; --radius:12px; --shadow:0 2px 8px rgba(0,0,0,0.06); --text:#1f2d3d; --muted:#6b7280; --border:#e8eaee; --brand:#6366f1; --brand-gradient:linear-gradient(90deg,#6366f1 0%,#a78bfa 100%); }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:"Inter",system-ui,sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }
.page-title { text-align:center; font-size:1.5rem; font-weight:700; margin:24px 0 8px; }
.page-subtitle { text-align:center; font-size:0.85rem; color:var(--muted); margin-bottom:20px; padding:0 1rem; }
.wrap { max-width:760px; margin:auto; padding:0 1.25rem 2rem; }
.card { background:var(--card-bg); padding:1.25rem; border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:1.25rem; }
.badge { display:inline-block; background:#eef2ff; color:var(--brand); font-size:0.7rem; font-weight:600; padding:3px 8px; border-radius:999px; }
textarea { width:100%; min-height:150px; resize:vertical; border:1px solid var(--border); border-radius:10px; padding:12px; font-family:inherit; font-size:0.9rem; color:var(--text); line-height:1.5; }
textarea:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(99,102,241,0.12); }
.btn { padding:0.6rem 1rem; border-radius:999px; cursor:pointer; border:none; font-size:0.82rem; font-weight:600; transition:all .2s; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
.btn-primary { background:var(--brand-gradient); color:#fff; }
.btn-primary:hover:not(:disabled) { filter:brightness(1.06); transform:translateY(-1px); box-shadow:0 4px 12px rgba(99,102,241,0.3); }
.btn-outline { background:#fff; border:1px solid var(--border); color:#374151; }
.btn-outline:hover { background:#f9fafb; }
.btn-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
.out { width:100%; margin-top:12px; border:1px solid var(--border); border-radius:10px; padding:12px; font-size:0.88rem; line-height:1.55; background:#fafafa; min-height:70px; white-space:pre-wrap; word-break:break-word; }
.copied { color:#059669 !important; }
  </style>
</head>
<body>
<h1 class="page-title">Case Converter <span class="badge">Free</span></h1>
<p class="page-subtitle">Transform text into any case. 100% in your browser, nothing is uploaded.</p>

<div class="wrap">
  <div class="card">
    <textarea id="ccInput" placeholder="Type text to convert…"></textarea>
    <div class="btn-row">
      <button class="btn btn-outline" data-case="upper">UPPERCASE</button>
      <button class="btn btn-outline" data-case="lower">lowercase</button>
      <button class="btn btn-outline" data-case="title">Title Case</button>
      <button class="btn btn-outline" data-case="sentence">Sentence case</button>
      <button class="btn btn-outline" data-case="camel">camelCase</button>
      <button class="btn btn-outline" data-case="snake">snake_case</button>
      <button class="btn btn-outline" data-case="kebab">kebab-case</button>
    </div>
    <div class="out" id="ccOut"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="ccCopy">Copy result</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  function copyText(text, btn) {
    if (!text) return;
    function flash() {
      if (!btn) return;
      var old = btn.textContent;
      btn.textContent = "Copied!"; btn.classList.add("copied");
      setTimeout(function () { btn.textContent = old; btn.classList.remove("copied"); }, 1400);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(flash, function () { legacyCopy(text); flash(); });
    } else { legacyCopy(text); flash(); }
  }
  function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }

  var ccInput = document.getElementById("ccInput");
  var ccOut = document.getElementById("ccOut");
  var ccMode = "upper";
  function words(str) { return (str.match(/[A-Za-z0-9]+/g) || []); }
  function convert(str, mode) {
    switch (mode) {
      case "upper": return str.toUpperCase();
      case "lower": return str.toLowerCase();
      case "title": return str.replace(/\w\S*/g, function (w) { return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase(); });
      case "sentence":
        var lower = str.toLowerCase();
        return lower.replace(/(^\s*\w)|([.!?]\s*\w)/g, function (m) { return m.toUpperCase(); });
      case "camel":
        var w = words(str.toLowerCase());
        return w.map(function (x, i) { return i === 0 ? x : x.charAt(0).toUpperCase() + x.slice(1); }).join("");
      case "snake": return words(str.toLowerCase()).join("_");
      case "kebab": return words(str.toLowerCase()).join("-");
      default: return str;
    }
  }
  function renderCase() { ccOut.textContent = convert(ccInput.value, ccMode); }
  document.querySelectorAll("[data-case]").forEach(function (b) {
    b.addEventListener("click", function () {
      ccMode = b.getAttribute("data-case");
      document.querySelectorAll("[data-case]").forEach(function (x) { x.classList.remove("btn-primary"); x.classList.add("btn-outline"); });
      b.classList.remove("btn-outline"); b.classList.add("btn-primary");
      renderCase();
    });
  });
  ccInput.addEventListener("input", renderCase);
  document.getElementById("ccCopy").addEventListener("click", function () { copyText(ccOut.textContent, this); });
})();
</script>
<script src="nav.js" defer></script>
</body>
</html>
